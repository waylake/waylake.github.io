    <a href="/posts/" class="btn-secondary">View all posts</a>

</div>

    display: flex;
    justify-content: center;

    border-radius: 4px;
    transition: all 0.2s;
  }

  .btn-primary:hover {
    background: var(--muted);

  .btn-secondary {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: var(--code-bg);
    color: var(--text);
    text-decoration: none;
