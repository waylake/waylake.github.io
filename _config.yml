g:0}.page-body blockquote{margin:1.5rem 0;padding-left:1rem;border-left:1px solid var(--border);color:var(--muted);font-style:italic}.page-body ol,.page-body ul{margin:1rem 0;padding-left:1.25rem}.page-body li{margin:.4rem 0}.page-body table{width:100%;border-collapse:collapse;margin:1.5rem 0}.page-body td,.page-body th{border:1px solid var(--border);padding:.6rem;text-align:left}.page-body th{background:var(--code-bg)}.page-body hr{border:none;border-top:1px solid var(--border);margin:2.5rem 0}.post-content{max-width:var(--max-width);margin:0 auto}.post-header{margin-bottom:2.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}.post-title{font-size:1.4rem;font-weight:400;margin:0 0 .75rem 0;line-height:1.5}.post-meta{font-size:.8rem;color:var(--muted);margin-top:.4rem;font-weight:300}.post-meta span{margin-right:.75rem}.post-body{line-height:1.9}.post-body h1,.post-body h2,.post-body h3,.post-body h4,.post-body h5,.post-body h6{font-weight:400;line-height:1.6;margin-top:2rem;margin-bottom:.75rem}.post-body h1{font-size:1.5rem}.post-body h2{font-size:1.25rem}.post-body h3{font-size:1.1rem}.post-body p{margin:1rem 0}.post-body a{text-decoration:underline;text-underline-offset:2px}.post-body code{background:var(--code-bg);padding:.1rem .3rem;border-radius:2px;font-family:"SF Mono",Consolas,monospace;font-size:.85em}.post-body pre{background:var(--code-bg);padding:1rem;border-radius:2px;overflow-x:auto;margin:1.5rem 0;border:1px solid var(--border)}.post-body pre code{background:0 0;padding:0}.post-body blockquote{margin:1.5rem 0;padding-left:1rem;border-left:1px solid var(--border);color:var(--muted);font-style:italic}.post-body ol,.page-body ul{margin:1rem 0;padding-left:1.25rem}.page-body li{margin:.4rem 0}.page-body table{width:100%;border-collapse:collapse;margin:1.5rem 0}.page-body td,.page-body th{border:1px solid var(--border);padding:.6rem;text-align:left}.page-body th{background:var(--code-bg)}.post-body hr{border:none;border-top:1px solid var(--border);margin:2.5rem 0}.post-navigation{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:1rem}.post-navigation a{color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:300;transition:color .3s ease}.post-navigation a:hover{color:var(--text)}@media (max-width:768px){.site-header-content{flex-direction:column;gap:1rem}.site-nav .trigger{gap:1.25rem}.main-content{padding:3rem 1.25rem}.theme-toggle-container{bottom:1rem;right:1rem}}@media print{.site-footer,.site-header,.theme-toggle-container{display:none}body{background:#fff;color:#000}.main-content{max-width:100%}}