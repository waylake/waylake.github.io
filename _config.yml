# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Way Log
description: GitHub collaboration strategies and development-related thoughts
description_ko: GitHub 협업 문제 해결 및 개발 워크플로우 최적화에 대한 생각과 전략을 공유합니다.
baseurl: ""
url: "https://waylake.github.io"
twitter_username: waylake
github_username: waylake

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# English language support
lang: en
encoding: utf-8
timezone: UTC

# Inlined CSS for performance
theme_css: |
  :root{--bg:#fafafa;--text:#2a2a2a;--muted:#8a8a8a;--border:#e5e5e5;--link:#2a2a2a;--code-bg:#f0f0f0;--header-bg:#fafafa;--max-width:600px}[data-theme=dark]{--bg:#141414;--text:#d0d0d0;--muted:#6a6a6a;--border:#2a2a2a;--link:#d0d0d0;--code-bg:#1f1f1f;--header-bg:#141414}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue","Noto Sans KR",-apple-system,sans-serif;font-size:15px;line-height:1.8;font-weight:300;letter-spacing:.02em;transition:background-color .5s,color .5s}a{color:var(--link);text-decoration:none;transition:color .3s ease}a:hover{opacity:.7}.site-header{background:var(--header-bg);border-bottom:1px solid transparent;padding:2.5rem 0;transition:background-color .5s}.site-header-content{max-width:var(--max-width);margin:0 auto;padding:0 1.5rem;display:flex;justify-content:space-between;align-items:center}.site-title-container{display:flex;align-items:center;gap:.75rem;text-decoration:none}.site-title{font-size:.8rem;font-weight:400;letter-spacing:.1em;color:var(--text)}.profile-image{width:28px;height:28px;border-radius:50%;object-fit:cover;opacity:.8}.site-nav .trigger{display:flex;gap:1.5rem}.page-link{color:var(--muted);text-decoration:none;font-size:.75rem;font-weight:300;letter-spacing:.05em;transition:color .3s ease}.page-link:hover{color:var(--text)}.main-content{max-width:var(--max-width);margin:0 auto;padding:4rem 1.5rem;min-height:calc(100vh - 200px)}h1,h2,h3,h4,h5,h6{font-weight:400;line-height:1.6;margin-top:2rem;margin-bottom:.75rem}h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.1rem}h4{font-size:1rem}p{margin:1rem 0;line-height:1.9}code{background:var(--code-bg);padding:.1rem .3rem;border-radius:2px;font-family:"SF Mono",Consolas,monospace;font-size:.85em;font-weight:400}pre{background:var(--code-bg);padding:1rem;border-radius:2px;overflow-x:auto;margin:1.5rem 0;border:1px solid var(--border)}pre code{background:0 0;padding:0}blockquote{margin:1.5rem 0;padding-left:1rem