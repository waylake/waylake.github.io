<header class="site-header">
  <div class="site-header-content">
    <a href="{{ "/" | relative_url }}" class="site-title-container">
      <img src="{{ "/assets/images/profile.jpg" | relative_url }}" alt="Waylake" class="profile-image" width="32" height="32" onerror="this.style.display='none'">
      <span class="site-title">{{ site.title | escape }}</span>
    </a>

    <nav class="site-nav">
      <div class="trigger">
        <a class="page-link" href="{{ "/" | relative_url }}">홈</a>
        <a class="page-link" href="{{ "/about/" | relative_url }}">소개</a>
        <a class="page-link" href="{{ "/posts/" | relative_url }}">글</a>
        {% if site.github_username %}
          <a class="page-link" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
        {% endif %}
      </div>
    </nav>
  </div>
</header>
