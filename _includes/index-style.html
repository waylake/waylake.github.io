<style>
  .hero {
    position: relative;
    width: 100%;
    height: 200px;

    border-radius: 4px;
    background-size: cover;
    background-position: center 70%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(
      rgba(255, 255, 255, 0.5),
      rgba(255, 255, 255, 0.5)
    );
    pointer-events: none;
    z-index: 1;
  }

  [data-theme="dark"] .hero::before {
    background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4));
  }

  .hero-content {
    position: relative;
    z-index: 2;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.4);
  }

  [data-theme="dark"] .hero-content {
    color: var(--text);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  [data-theme="dark"] .hero::after {
    background:
      linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),
      url("{{ "/assets/images/landing-bg.webp" | relative_url }}");
  }

  [data-theme="dark"] .hero {
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),
      url("{{ "/assets/images/landing-bg.webp" | relative_url }}");
  }

  .hero-title {
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    margin: 0 0 0.75rem 0;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.4);
  }

  [data-theme="dark"] .hero-title {
    color: var(--text);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  .hero-subtitle {
    color: var(--text);
    font-size: 0.8rem;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.3);
  }

  [data-theme="dark"] .hero-subtitle {
    color: var(--text);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

    margin: 3rem 0;

    color: var(--text);
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    transition: color 0.3s ease;
  }

  .category-item:hover {
    color: var(--muted);
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 2rem auto;
  }

  .section-header {
    margin: 3rem 0 1.5rem;
    text-align: center;
  }

  .section-label {
    font-size: 0.75rem;

    font-weight: 400;
    letter-spacing: 0.2em;

    color: var(--text);
    font-weight: 400;
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.3s ease;
  }

  .more-link a:hover {
    color: var(--muted);
  }

      gap: 1rem;

    display: grid;

    gap: 1.5rem;
    margin: 2rem 0;
  }

    .sumi-gallery {
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg-secondary);
    transition: transform 0.4s ease;
  }

  .sumi-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(

      rgba(0, 0, 0, 0.05) 0%,
      rgba(0, 0, 0, 0.15) 50%,
      rgba(0, 0, 0, 0.25) 100%

    pointer-events: none;
    z-index: 1;
  }

    background: linear-gradient(

      rgba(0, 0, 0, 0.1) 0%,

      rgba(0, 0, 0, 0.35) 100%

  }

    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(20%);
    transition: all 0.4s ease;
  }

    filter: grayscale(20%) brightness(0.75);

  .sumi-card:hover img {
    filter: grayscale(0%);

  }

    position: absolute;
    bottom: 1.25rem;
    right: 1.25rem;
    color: var(--text);
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-shadow: 0 1px 3px rgba(255,255,255,0.4);

  }

  [data-theme="dark"] .sumi-philosophy {
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

    width: 1px;
    height: 60px;
    background: var(--border);
    margin: 0 auto 3rem;
  }

  .sumi-section-label {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
