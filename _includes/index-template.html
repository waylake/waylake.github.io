<div class="zen-hero-container">
  <div class="zen-hero-image" style="background-image: url('{{ "/assets/images/landing-bg.webp" | relative_url }}');"></div>
  <div class="zen-hero-caption">
    <h1 class="zen-hero-title">{{ include.hero_title }}</h1>
    <p class="zen-hero-subtitle">{{ include.hero_subtitle }}</p>
  </div>
</div>

<div class="zen-category-grid">
  {% for category in site.data.categories %}
  <a href="{{ category.url | relative_url }}" class="zen-category-item">
    <div class="zen-category-image" style="background-image: url('{{ category.image | relative_url }}');"></div>
    <span class="zen-category-label">{{ category.name }}</span>
  </a>
  {% endfor %}
</div>

<div class="zen-sumi-section">
  <div class="zen-sumi-grid">
    {% for sumi in site.data.sumi %}
    <div class="zen-sumi-item">
      <img src="{{ sumi.image | relative_url }}" alt="{{ sumi.kanji }}" class="zen-sumi-image">
      <span class="zen-sumi-term">{{ sumi.kanji }}</span>
    </div>
    {% endfor %}
  </div>
</div>
