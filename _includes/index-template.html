<div class="hero" style="background-image: url('{{ "/assets/images/landing-bg.webp" | relative_url }}');">
  <div class="hero-content">
    <h1 class="hero-title">{{ include.hero_title }}</h1>
    <p class="hero-subtitle">{{ include.hero_subtitle }}</p>
  </div>
</div>

<div class="category-nav">
  <a href="/cognition" class="category-item">認知科學</a>
  <a href="/psychology" class="category-item">心理學</a>
  <a href="/philosophy" class="category-item">哲學</a>
</div>

<div class="divider"></div>

<div class="section-header">
  <span class="section-label">近況</span>
</div>

<div class="post-list">
{% for post in site.posts limit:5 %}
<a href="{{ post.url | relative_url }}" class="post-link">
  <span class="post-title">{{ post.title }}</span>
  <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
</a>
{% endfor %}
</div>

<div class="more-link">
  <a href="/posts">すべて見る →</a>
</div>

{% include index-style.html %}
{% include category-style.html %}
