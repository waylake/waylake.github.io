<div class="zen-hero-container">
  <div class="zen-hero-image" style="background-image: url('{{ "/assets/images/landing-bg.webp" | relative_url }}');"></div>
  <div class="zen-hero-caption">
    <h1 class="zen-hero-title">{{ include.hero_title }}</h1>
    <p class="zen-hero-subtitle">{{ include.hero_subtitle }}</p>
  </div>
</div>

<div class="zen-category-grid">
  <a href="/cognition" class="zen-category-item">
    <div class="zen-category-image" style="background-image: url('{{ "/assets/images/cognition.webp" | relative_url }}');"></div>
    <span class="zen-category-label">認知科學</span>
  </a>
  <a href="/psychology" class="zen-category-item">
    <div class="zen-category-image" style="background-image: url('{{ "/assets/images/psychology.webp" | relative_url }}');"></div>
    <span class="zen-category-label">心理學</span>
  </a>
  <a href="/philosophy" class="zen-category-item">
    <div class="zen-category-image" style="background-image: url('{{ "/assets/images/philosophy.webp" | relative_url }}');"></div>
    <span class="zen-category-label">哲學</span>
  </a>
</div>

<div class="zen-sumi-section">
  <div class="zen-sumi-grid">
    <div class="zen-sumi-item">
      <img src="{{ "/ast/sumi_e_stillness.svg" | relative_url }}" alt="静" class="zen-sumi-image">
      <span class="zen-sumi-term">静</span>
    </div>
    <div class="zen-sumi-item">
      <img src="{{ "/ast/sumi_e_space.svg" | relative_url }}" alt="間" class="zen-sumi-image">
      <span class="zen-sumi-term">間</span>
    </div>
    <div class="zen-sumi-item">
      <img src="{{ "/ast/sumi_e_hand_pouring_water.svg" | relative_url }}" alt="素" class="zen-sumi-image">
      <span class="zen-sumi-term">素</span>
    </div>
    <div class="zen-sumi-item">
      <img src="{{ "/ast/sumi_e_emptiness.svg" | relative_url }}" alt="空" class="zen-sumi-image">
      <span class="zen-sumi-term">空</span>
    </div>
  </div>
</div>
