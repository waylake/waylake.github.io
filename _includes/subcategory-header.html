<div class="zen-subcategory-header">
  <h1 class="zen-subcategory-title">{{ include.title }}</h1>
  <p class="zen-subcategory-description">{{ include.description }}</p>

  {% if include.keywords %}
  <div class="zen-keywords">
    {% for keyword in include.keywords %}
    <span class="zen-keyword">{{ keyword }}</span>
    {% endfor %}
  </div>
  {% endif %}

  {% if include.philosophers %}
  <div class="zen-philosophers">
    <p class="zen-philosophers-label">主要哲學者</p>
    <div class="zen-philosophers-list">
      {% for philosopher in include.philosophers %}
      <span class="zen-philosopher">{{ philosopher }}</span>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</div>
