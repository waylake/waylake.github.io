<div class="zen-subcategory-header">
  <h1 class="zen-subcategory-title">{{ include.title }}</h1>
  <p class="zen-subcategory-description">{{ include.description }}</p>

  {% if include.keywords %}
  <div class="zen-keywords">
    {% for keyword in include.keywords %}
    <span class="zen-keyword">{{ keyword }}</span>
    {% endfor %}
  </div>
  {% endif %}

  {% if include.philosophers %}
  <div class="zen-philosophers">
    <p class="zen-philosophers-label">主要哲學者</p>
    <div class="zen-philosophers-list">
      {% for philosopher in include.philosophers %}
      <span class="zen-philosopher">{{ philosopher }}</span>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</div>

<style>
  .zen-subcategory-header {
    max-width: 700px;
    margin: 0 auto 3rem;
    text-align: center;
  }

  .zen-subcategory-title {
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    margin: 0 0 1rem 0;
  }

  .zen-subcategory-description {
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin: 0 0 2rem 0;
    opacity: 0.8;
    line-height: 1.6;
  }

  .zen-keywords {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
    margin: 1.5rem 0;
  }

  .zen-keyword {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  .zen-philosophers {
    margin: 2rem 0;
  }

  .zen-philosophers-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    margin: 0 0 1rem 0;
    opacity: 0.6;
  }

  .zen-philosophers-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
  }

  .zen-philosopher {
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }
</style>
