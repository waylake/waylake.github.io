<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ "/assets/css/theme.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/images/favicon.svg" | relative_url }}">

  <!-- Theme initialization: runs before page render to prevent blinking -->
  <script>
    (function () {
      var theme = localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <!-- Bing Webmaster Verification -->
  <meta name="msvalidate.01" content="E7C5337E2281A4D66104A8C0256AA264">

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="92vP6_uhTN26jQcqrF15Wh90AWzz7j5autqQGBJ843A">

  <!-- AI Search Optimization: WebSite Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "author": {
      "@type": "Person",
      "name": "waylake",
      "url": "https://github.com/waylake"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ site.url }}/?s={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  {% include header.html %}

  <main class="main-content">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include theme-toggle.html %}
</body>
</html>
