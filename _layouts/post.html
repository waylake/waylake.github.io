---
layout: base
article_schema: true
post_navigation: true
---
<article class="post-content">
  <a
    href="{{ "/posts/" | relative_url }}"
    class="post-back"
    id="post-back"
    aria-label="뒤로 가기"
    >← 뒤로</a
  >

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%Y년 %m월 %d일" }}</span>
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
