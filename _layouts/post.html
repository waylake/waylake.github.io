---
layout: base
article_schema: true
---
{% assign words = content | strip_html | number_of_words %}
{% assign read_min = words | divided_by: 160 | at_least: 1 %}

<div class="reading-progress-track" aria-hidden="true">
  <div class="reading-progress-fill" id="reading-progress-fill"></div>
</div>

<article class="post-content">
  <div class="post-layout">
    <aside class="post-sidebar">
      <div class="post-sidebar-sticky">
        <a
          href="{{ "/posts/" | relative_url }}"
          class="post-back"
          id="post-back"
          aria-label="뒤로 가기"
          >← 뒤로</a
        >
        <div class="post-meta">
          <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%Y년 %m월 %d일" }}
          </time>
          <span class="post-reading-time">{{ read_min }}분 읽기</span>
        </div>
      </div>
    </aside>

    <div class="post-main">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
      </header>

      <div class="post-body">
        {{ content }}
      </div>
    </div>
  </div>
</article>
