---
layout: base
article_schema: true
post_navigation: true
---
<article class="post-content">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%Y년 %m월 %d일" }}</span>
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
